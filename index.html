<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script id="theme-script">(function(){var h=document.documentElement;var t=null;try{t=localStorage.getItem('caderno:v1:tema')}catch(e){}if(t!=='light'&&t!=='dark'){t=(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light'}h.setAttribute('data-theme',t);try{var l=localStorage.getItem('caderno:v1:idioma');if(l)h.setAttribute('lang',l)}catch(e){}})();</script>
    <title>Caderno de contas — quanto sobrou este mês?</title>
    <meta
      name="description"
      content="Suba a planilha que você já usa e veja em segundos quanto entrou, quanto saiu e quanto sobrou. Sem cadastro. Tudo calculado no seu navegador."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
